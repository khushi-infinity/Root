services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: roots
      POSTGRES_PASSWORD: "-CGGltc-rhC2Rh-C6UiIf4CcIsCikDiX"
    volumes:
      - roots_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "ClP2YTSFwI6kAlt_tQD-ivO608JMdrLp"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: roots_test
      POSTGRES_PASSWORD: "NoP9Ov4Sp1guAEvMWW3b9B3VUvN0a2Mr"
    volumes:
      - roots_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "uTWeFskmxPQlMwMyzCpL--GjXCqPeYUr"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  roots_data:
  roots_test_data:
